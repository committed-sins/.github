name: Generate organization profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - .github/workflows/generate-profile.yml
      - profile/README.md
      - scripts/generate-profile.mjs

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate profile from public repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "orgs/$GITHUB_REPOSITORY_OWNER/repos?type=public&per_page=100" > "$RUNNER_TEMP/repositories.json"
          mkdir -p "$RUNNER_TEMP/generated-profile"
          node scripts/generate-profile.mjs "$RUNNER_TEMP/repositories.json" "$RUNNER_TEMP/generated-profile/README.md"
          diff -u --label a/profile/README.md --label b/profile/README.md profile/README.md "$RUNNER_TEMP/generated-profile/README.md" > "$RUNNER_TEMP/generated-profile/profile.diff" || test "$?" -eq 1
          if test -s "$RUNNER_TEMP/generated-profile/profile.diff"; then
            echo 'The artifact contains a proposed README update and its diff.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The organization profile already matches the repository metadata.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-profile
          path: ${{ runner.temp }}/generated-profile/
          if-no-files-found: error
